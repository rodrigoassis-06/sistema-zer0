<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema 0 — Catálogo Oficial & Fichas Técnicas</title>

  <!-- Fontes Oficiais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Lexend"', 'sans-serif'],
            sans: ['"Atkinson Hyperlegible"', '"Lexend"', 'sans-serif'],
          },
          colors: {
            primary: '#0063B1',
            'primary-foreground': '#FFFFFF',
            secondary: '#2B2F36',
            'secondary-foreground': '#FFFFFF',
            band: '#F4F6F9',
            page: '#FFFFFF',
            ink: '#0F172A',
            accent: '#CBD5E1',
            stage: '#090C12',
            'stage-foreground': '#F8FAFC',
            border: '#E2E8F0',
            'muted-foreground': '#64748B',
            'brand-orange': '#E66A00',
            'brand-green': '#72A824',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Biblioteca PageFlip Oficial -->
  <script src="./js/page-flip.browser.js"></script>

  <style>
    body {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background-color: #090C12;
      color: #F8FAFC;
      overflow: hidden;
      user-select: none;
    }

    /* Fundo de palco tecnológico */
    .bg-stage-pattern {
      background-color: #080B10;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 99, 177, 0.15) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    /* Container da Revista Folheável */
    .flip-book {
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 99, 177, 0.12);
      margin: 0 auto;
    }

    /* Páginas brancas estilo editorial revista */
    .page {
      background-color: #FFFFFF;
      color: #0F172A;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      position: relative;
    }

    /* Sombra do vinco central da revista */
    .page-left {
      box-shadow: inset -15px 0 25px -10px rgba(0, 0, 0, 0.12);
    }
    .page-right {
      box-shadow: inset 15px 0 25px -10px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between bg-stage-pattern">

  <!-- ================= TOP HEADER ================= -->
  <header class="h-14 px-6 flex items-center justify-between border-b border-white/10 bg-black/50 backdrop-blur-md z-30">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-1.5 px-3 py-1 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> <span>Voltar ao Sistema</span>
      </a>
      <div class="h-4 w-[1px] bg-white/15"></div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        <span class="font-display font-bold text-xs sm:text-sm text-white tracking-wide">SISTEMA 0 • CATÁLOGO & FICHAS TÉCNICAS</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleThumbnails()" class="px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 flex items-center gap-1.5">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Índice</span>
      </button>
      <button onclick="toggleFullscreen()" class="p-1.5 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10">
        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <!-- ================= PALCO CENTRAL (REVISTA 3D) ================= -->
  <main class="flex-1 flex items-center justify-center p-2 sm:p-4 relative overflow-hidden">
    
    <!-- Botão Anterior -->
    <button onclick="flipPrev()" aria-label="Página anterior" class="absolute left-3 sm:left-8 z-20 p-3 sm:p-3.5 rounded-full bg-black/60 hover:bg-primary border border-white/15 text-white transition-all shadow-2xl backdrop-blur-md">
      <i data-lucide="chevron-left" class="w-5 h-5"></i>
    </button>

    <!-- O Livro 3D montado dinamicamente -->
    <div id="magazine" class="flip-book">
      <!-- Páginas inseridas dinamicamente pelo JavaScript com a estrutura exata do React -->
    </div>

    <!-- Botão Próximo -->
    <button onclick="flipNext()" aria-label="Próxima página" class="absolute right-3 sm:right-8 z-20 p-3 sm:p-3.5 rounded-full bg-black/60 hover:bg-primary border border-white/15 text-white transition-all shadow-2xl backdrop-blur-md">
      <i data-lucide="chevron-right" class="w-5 h-5"></i>
    </button>
  </main>

  <!-- ================= BOTTOM BAR ================= -->
  <footer class="h-14 px-6 flex items-center justify-between border-t border-white/10 bg-black/50 backdrop-blur-md z-30">
    <div class="text-xs text-slate-400 font-display flex items-center gap-2">
      <i data-lucide="book-open" class="w-4 h-4 text-primary"></i>
      <span id="page-counter">Capa · Pág 1 de 10</span>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="flipPrev()" class="px-3 py-1.5 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3 h-3"></i> <span>Anterior</span>
      </button>
      <button onclick="flipNext()" class="px-3 py-1.5 rounded-md bg-primary hover:bg-[#0070C9] text-white text-xs font-medium flex items-center gap-1 shadow">
        <span>Próxima</span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
      </button>
    </div>

    <div class="text-[11px] text-slate-500 hidden sm:block">
      Dica: Você pode virar a folha arrastando a borda com o mouse ou usando as setas do teclado.
    </div>
  </footer>

  <!-- ================= MODAL DE ÍNDICE / MINIATURAS ================= -->
  <div id="modal-thumbnails" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md p-6 sm:p-12 flex flex-col justify-between">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
      <h3 class="text-lg font-display font-semibold text-white flex items-center gap-2">
        <i data-lucide="layout-grid" class="w-5 h-5 text-primary"></i> Índice Completo (10 Páginas)
      </h3>
      <button onclick="toggleThumbnails()" class="p-2 rounded-lg bg-white/10 text-white hover:bg-white/20">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div id="thumbnails-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-4 my-6 overflow-y-auto max-h-[70vh] p-2">
      <!-- Inserido dinamicamente -->
    </div>

    <div class="text-center">
      <button onclick="toggleThumbnails()" class="px-6 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs">
        Fechar Índice
      </button>
    </div>
  </div>

  <!-- ================= LÓGICA E DADOS DA REVISTA ================= -->
  <script>

      ["Disponibilidade dos dados em nuvem", "99.9%", "Seguro"],
      ["Retorno sobre investimento (ROI)", "30 dias", "Garantido"],
    ];

      {
        name: ["SISTEMA 0", "DASHBOARD"],
        flavor: "Visão Geral & Inteligência",

        weight: "Tempo Real",
        doses: "2 cliques",
        claims: [
          "Visão panorâmica e centralizada de todos os indicadores críticos do negócio.",

          "Faturamento automatizado",

      {

        flavor: "Atendimentos & Reservas",

          "Duração inteligente por serviço",

        ],
        ingredients: "Engine de agendamento com detecção automática de choque de horários, cálculo de intervalo entre profissionais e integração nativa com o módulo de comissões e faturamento.",
        nutrition: baseNutrition.map(([a, b, c], i) => [a, i === 2 ? "-60%" : i === 0 ? "-90%" : b, c])
      },
      {
        name: ["SISTEMA 0", "CLIENTES"],
        flavor: "CRM & Fidelização LTV",
        img: "./img/mockup_laptop_sistema_zero.png",
        weight: "Busca < 10ms",

    // GERAÇÃO DAS 10 PÁGINAS SEGUINDO EXATAMENTE A ESTRUTURA DO REACT
    function renderPages() {
      const container = document.getElementById('magazine');
      let pagesHTML = '';

      // PÁGINA 1: CAPA
      pagesHTML += `
        <div class="page page-right flex flex-col justify-between p-8 sm:p-12 relative bg-gradient-to-br from-white via-slate-50 to-slate-100" data-density="hard">
          <div class="relative z-10">

              <div class="font-display font-bold text-primary flex items-center gap-2">
                <span class="w-3.5 h-3.5 bg-primary rounded-sm"></span>
                <span class="text-2xl tracking-tight">SISTEMA 0</span>
              </div>
              <span class="text-[10px] font-semibold tracking-widest uppercase bg-band px-2.5 py-1 rounded text-muted-foreground">Edição Oficial 2026</span>
            </div>
            
            <div class="mt-8">
              <span class="text-[11px] font-bold text-primary tracking-widest uppercase block mb-1">Catálogo Oficial de Tecnologia</span>
              <h1 class="font-display text-4xl sm:text-5xl font-bold text-ink leading-[0.95] tracking-tight">
                A Gestão da sua<br>empresa em<br><span class="text-primary">dois cliques.</span>
              </h1>
              <p class="mt-3 text-xs text-muted-foreground leading-relaxed max-w-sm">
                Fichas técnicas, diferenciais de engenharia e métricas de impacto do ERP & CRM Multi-Nicho desenvolvido para negócios modernos.
              </p>
            </div>
          </div>

          <div class="relative z-10 my-4 flex items-center justify-center">
            <img src="./img/mockup_laptop_sistema_zero.png" alt="Sistema 0 Mockup" class="w-full max-w-sm drop-shadow-2xl rounded">
          </div>

          <div class="relative z-10 border-t border-border pt-3 flex items-center justify-between text-[10px] text-muted-foreground">
            <span>sistema-zero.com.br</span>
            <span class="text-primary font-semibold flex items-center gap-1">Folheie para explorar <i data-lucide="arrow-right" class="w-3 h-3"></i></span>
          </div>
        </div>
      `;

      // PÁGINA 2: MANIFESTO
      pagesHTML += `
        <div class="page page-left flex flex-col justify-between p-8 sm:p-12 bg-band text-ink">
          <div>
            <div class="font-display font-bold text-primary flex items-center gap-2 mb-6">
              <span class="w-3 h-3 bg-primary rounded-sm"></span>
              <span class="text-2xl tracking-tight">SISTEMA 0</span>
            </div>
            
            <h2 class="font-display text-3xl sm:text-4xl font-bold leading-tight text-ink">
              Gestão de verdade,<br>feita para o seu<br><span class="text-primary">negócio crescer.</span>
            </h2>
            
            <p class="mt-4 text-xs text-muted-foreground leading-relaxed">
              O mercado foi saturado por softwares complexos, lentos e cheios de menus infinitos que roubam o tempo produtivo de quem deveria estar atendendo clientes e expandindo as vendas.
            </p>
            
            <p class="mt-3 text-xs text-muted-foreground leading-relaxed">
              O <strong>Sistema 0</strong> foi concebido sobre uma premissa inegociável: <strong>qualquer rotina operacional crítica deve ser executada em até dois cliques</strong>. Sem telas poluídas, sem treinamento desgastante e com funcionamento nativo em qualquer tela.
            </p>

            <div class="mt-6 p-4 rounded-lg bg-page border border-border">
              <span class="font-display text-xs font-bold text-primary block mb-1">ARQUITETURA MULTI-NICHO</span>
              <p class="text-[11px] text-muted-foreground leading-snug">
                Projetado para atender com excelência prestadores de serviços, estúdios, clínicas, comércio, consultorias e empresas operacionais em escala.
              </p>
            </div>
          </div>

          <div class="border-t border-border pt-3 flex items-center justify-between text-[10px] text-muted-foreground">
            <span>SISTEMA 0 ENTERPRISE</span>
            <span class="font-mono">PÁG 02</span>
          </div>
        </div>
      `;

      // PÁGINA 3: ÍNDICE
      pagesHTML += `
        <div class="page page-right flex flex-col justify-between p-8 sm:p-12 bg-page text-ink">
          <div>
            <h2 class="font-display text-3xl font-bold text-ink tracking-tight">ÍNDICE DO CATÁLOGO</h2>

        const pageNum = idx + 4;
        const isLeft = pageNum % 2 === 0;

              <div class="flex flex-col">
                ${p.claims.map(c => `
                  <p class="border-b-2 border-primary/60 py-1 text-[10.5px] leading-snug text-ink font-normal">${c}</p>
                `).join('')}

                <div class="mt-2 grid grid-cols-2 gap-2">
                  <!-- Diferenciais -->
                  <div>
                    <h3 class="font-display text-[10px] font-bold uppercase text-ink">DIFERENCIAIS DO MÓDULO</h3>
                    <ul class="mt-1 space-y-1 bg-band p-1.5 rounded border border-border">
                      ${p.features.map(f => `
                        <li class="flex gap-1 font-display text-[9.5px] leading-tight text-ink items-start">
                          <i data-lucide="plus" class="h-3 w-3 shrink-0 text-primary mt-0.5"></i>
                          <span>${f}</span>
                        </li>
                      `).join('')}
                    </ul>
                  </div>

                  <!-- Especificações / Arquitetura -->
                  <div>
                    <h3 class="font-display text-[10px] font-bold uppercase text-ink">ARQUITETURA & SEGURANÇA</h3>
                    <p class="mt-1 bg-band p-1.5 text-justify text-[8px] leading-snug text-muted-foreground rounded border border-border">
                      ${p.ingredients}
                    </p>
                  </div>
                </div>

                <p class="mt-auto pt-1.5 text-[8px] text-muted-foreground border-t border-border mt-2">
                  <b class="text-primary">Implantação Imediata:</b> pronto para operar em menos de 10 minutos. 
                  <b class="text-primary">Disponibilidade:</b> 100% web, compatível com computadores, notebooks, tablets e smartphones.
                </p>
              </div>

              <!-- Coluna Direita (Tabela de Indicadores / Nutrição) -->
              <div>
                <h3 class="font-display text-[10px] font-bold uppercase text-ink">INDICADORES DE PERFORMANCE</h3>
                <p class="text-[8px] text-muted-foreground">Métrica operacional · Resultados comprovados</p>
                
                <table class="mt-1 w-full border-t border-ink text-[8px]">
                  <thead>
                    <tr class="border-b border-border font-bold">
                      <th class="text-left py-0.5">Indicador</th>
                      <th class="text-right py-0.5">Impacto</th>
                      <th class="text-right py-0.5">Nível</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${p.nutrition.map(([a, b, c]) => `
                      <tr class="border-b border-border/80 hover:bg-slate-50">
                        <td class="py-0.5 text-ink">${a}</td>
                        <td class="text-right font-bold text-primary">${b}</td>
                        <td class="text-right text-muted-foreground">${c}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                <p class="mt-1 text-[7px] text-muted-foreground">*Dados médios apurados em empresas ativas no Sistema 0.</p>
              </div>
            </div>

            <!-- Rodapé da Ficha Técnica -->
            <div class="mt-2 border-t border-border pt-1.5 flex justify-between text-[9px] text-muted-foreground">
              <span>SISTEMA 0 • FICHA TÉCNICA OFICIAL</span>
              <span class="font-mono">PÁG 0${pageNum}</span>
            </div>
          </div>
        `;
      });

      // PÁGINA 10: CONTRACAPA
      pagesHTML += `
        <div class="page page-left flex h-full flex-col items-center justify-center gap-4 bg-primary p-[10%] text-center text-primary-foreground" data-density="hard">
          <div class="font-display font-bold leading-none text-white">
            <span class="text-4xl tracking-tight">✱ SISTEMA 0</span>
            <div class="text-xs font-semibold tracking-widest mt-1 opacity-80 uppercase">A gestão em dois cliques</div>
          </div>

          <h2 class="font-display text-2xl sm:text-3xl font-bold mt-4 leading-tight">
            Pronto para colocar sua empresa no piloto automático?
          </h2>

          <p class="text-xs max-w-sm opacity-90 leading-relaxed font-light">
            Entre em contato hoje mesmo e veja o Sistema 0 operando com os dados do seu segmento. Implantação rápida, suporte humano e tecnologia de ponta.
          </p>

          <div class="mt-6 p-4 rounded-xl bg-white text-ink text-left w-full max-w-xs shadow-xl">
            <span class="text-[9px] font-bold text-primary tracking-widest uppercase block mb-1">ACESSO ONLINE</span>
            <strong class="text-sm font-display block text-ink">sistema-zero.com.br</strong>
            <span class="text-[10px] text-muted-foreground block mt-0.5">contato@sistema-zero.com.br</span>
            
            <a href="/" class="mt-3 block text-center py-2 px-3 rounded bg-primary text-white text-xs font-bold hover:bg-[#0070C9] transition-colors">
              Acessar Sistema Agora
            </a>
          </div>

          <div class="mt-auto border-t border-white/20 pt-3 text-[10px] opacity-75">
            Sistema 0 Enterprise © 2026 · Todos os direitos reservados · SAC 0800 000 0000
          </div>
        </div>
      `;

      container.innerHTML = pagesHTML;
    }

    // INICIALIZAÇÃO DO PAGEFLIP 3D
    let pageFlip = null;

    function initFlipbook() {
      renderPages();
      buildThumbnails();

      const el = document.getElementById('magazine');
      if (!el || typeof St === 'undefined' || !St.PageFlip) return;

      const winW = window.innerWidth;
      const winH = window.innerHeight;
      
      let pageW = Math.min(520, Math.floor(winW * 0.44));
      let pageH = Math.min(740, Math.floor(winH * 0.80));

      if (winW < 768) {
        pageW = Math.min(420, Math.floor(winW * 0.92));
        pageH = Math.min(640, Math.floor(winH * 0.78));
      }

      pageFlip = new St.PageFlip(el, {
        width: pageW,
        height: pageH,
        size: "fixed",
        minWidth: 320,
        maxWidth: 620,
        minHeight: 460,
        maxHeight: 880,
        maxShadowOpacity: 0.5,
        showCover: true,
        useMouseEvents: true,
        usePortrait: winW < 768,
        startPage: 0,
        drawShadow: true,
        flippingTime: 650
      });

      pageFlip.loadFromHTML(document.querySelectorAll('.page'));

      pageFlip.on('flip', (e) => {
        updateCounter(e.data);
      });

      updateCounter(0);
      lucide.createIcons();
    }

    function updateCounter(pageIndex) {
      const counter = document.getElementById('page-counter');
      if (!counter) return;
      const total = 10;
      if (pageIndex === 0) {
        counter.textContent = `Capa · Pág 1 de ${total}`;
      } else if (pageIndex >= total - 1) {
        counter.textContent = `Contracapa · Pág ${total} de ${total}`;
      } else {
        const left = pageIndex + 1;
        const right = Math.min(pageIndex + 2, total);
        counter.textContent = `Páginas ${left}-${right} de ${total}`;
      }
    }

    function flipPrev() { if (pageFlip) pageFlip.flipPrev(); }
    function flipNext() { if (pageFlip) pageFlip.flipNext(); }

    function goToPage(index) {
      if (pageFlip) {
        pageFlip.flip(index);
        const modal = document.getElementById('modal-thumbnails');
        if (modal) modal.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleThumbnails() {
      const modal = document.getElementById('modal-thumbnails');
      if (modal) modal.classList.toggle('hidden');
    }

    function buildThumbnails() {
      const grid = document.getElementById('thumbnails-grid');
      if (!grid) return;

      const titles = [
        "Capa Oficial",
        "Manifesto Institucional",
        "Índice do Catálogo",
        "Ficha: Dashboard",
        "Ficha: Financeiro",
        "Ficha: Agenda",
        "Ficha: Clientes",
        "Ficha: Equipe & Metas",
        "Ficha: Serviços & Preços",
        "Contracapa & Contato"
      ];

      grid.innerHTML = titles.map((t, idx) => `
        <button onclick="goToPage(${idx})" class="p-3 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all hover:scale-105">
          <span class="text-[10px] text-primary font-bold block mb-1">PÁG ${idx + 1}</span>
          <strong class="text-xs text-white block truncate">${t}</strong>
          <span class="text-[10px] text-slate-400">Clique para abrir</span>
        </button>
      `).join('');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') flipNext();
      if (e.key === 'ArrowLeft') flipPrev();
      if (e.key === 'Escape') {
        const modal = document.getElementById('modal-thumbnails');
        if (modal) modal.classList.add('hidden');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initFlipbook, 150);
    });

    window.addEventListener('resize', () => {
      if (pageFlip) {
        pageFlip.destroy();
        setTimeout(initFlipbook, 200);
      }
    });
  </script>
</body>
</html>
