<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema 0 — Catálogo Oficial & Fichas Técnicas</title>

  <!-- Fontes Oficiais -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Lexend"', 'sans-serif'],
            sans: ['"Atkinson Hyperlegible"', '"Lexend"', 'sans-serif'],
          },
          colors: {
            primary: '#0063B1',
            'primary-foreground': '#FFFFFF',
            secondary: '#2B2F36',
            'secondary-foreground': '#FFFFFF',
            band: '#F4F6F9',
            page: '#FFFFFF',
            ink: '#0F172A',
            accent: '#CBD5E1',
            stage: '#090C12',
            'stage-foreground': '#F8FAFC',
            border: '#E2E8F0',
            'muted-foreground': '#64748B',
            'brand-orange': '#E66A00',
            'brand-green': '#72A824',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Atkinson Hyperlegible', sans-serif;
      background-color: #090C12;
      color: #F8FAFC;
      overflow: hidden;
      user-select: none;
    }

    .bg-stage-pattern {
      background-color: #080B10;
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(0, 99, 177, 0.15) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
    }

    .flip-book {
      box-shadow: 0 30px 70px -15px rgba(0, 0, 0, 0.95), 0 0 50px rgba(0, 99, 177, 0.12);
      margin: 0 auto;
    }

    .page {
      background-color: #FFFFFF;
      color: #0F172A;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.04);
      overflow: hidden;
      position: relative;
    }

    .page-left {
      box-shadow: inset -15px 0 25px -10px rgba(0, 0, 0, 0.12);
    }
    .page-right {
      box-shadow: inset 15px 0 25px -10px rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between bg-stage-pattern">

  <!-- ================= TOP HEADER ================= -->
  <header class="h-14 px-6 flex items-center justify-between border-b border-white/10 bg-black/50 backdrop-blur-md z-30">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-1.5 px-3 py-1 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 transition-colors">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> <span>Voltar ao Sistema</span>
      </a>
      <div class="h-4 w-[1px] bg-white/15"></div>
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
        <span class="font-display font-bold text-xs sm:text-sm text-white tracking-wide">SISTEMA 0 • CATÁLOGO & FICHAS TÉCNICAS</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="toggleThumbnails()" class="px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 flex items-center gap-1.5">
        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> <span class="hidden sm:inline">Índice</span>
      </button>
      <button onclick="toggleFullscreen()" class="p-1.5 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10">
        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>
      </button>
    </div>
  </header>

  <!-- ================= PALCO CENTRAL (REVISTA 3D) ================= -->
  <main class="flex-1 flex items-center justify-center p-2 sm:p-4 relative overflow-hidden">
    
    <!-- Botão Anterior -->
    <button onclick="flipPrev()" aria-label="Página anterior" class="absolute left-3 sm:left-8 z-20 p-3 sm:p-3.5 rounded-full bg-black/60 hover:bg-primary border border-white/15 text-white transition-all shadow-2xl backdrop-blur-md">
      <i data-lucide="chevron-left" class="w-5 h-5"></i>
    </button>

    <!-- O Livro 3D montado dinamicamente -->
    <div id="magazine" class="flip-book">
      <!-- Páginas inseridas dinamicamente pelo JavaScript com a estrutura exata do React -->
    </div>

    <!-- Botão Próximo -->
    <button onclick="flipNext()" aria-label="Próxima página" class="absolute right-3 sm:right-8 z-20 p-3 sm:p-3.5 rounded-full bg-black/60 hover:bg-primary border border-white/15 text-white transition-all shadow-2xl backdrop-blur-md">
      <i data-lucide="chevron-right" class="w-5 h-5"></i>
    </button>
  </main>

  <!-- ================= BOTTOM BAR ================= -->
  <footer class="h-14 px-6 flex items-center justify-between border-t border-white/10 bg-black/50 backdrop-blur-md z-30">
    <div class="text-xs text-slate-400 font-display flex items-center gap-2">
      <i data-lucide="book-open" class="w-4 h-4 text-primary"></i>
      <span id="page-counter">Capa · Pág 1 de 10</span>
    </div>

    <div class="flex items-center gap-2">
      <button onclick="flipPrev()" class="px-3 py-1.5 rounded-md bg-white/10 hover:bg-white/15 text-white text-xs border border-white/10 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3 h-3"></i> <span>Anterior</span>
      </button>
      <button onclick="flipNext()" class="px-3 py-1.5 rounded-md bg-primary hover:bg-[#0070C9] text-white text-xs font-medium flex items-center gap-1 shadow">
        <span>Próxima</span> <i data-lucide="arrow-right" class="w-3 h-3"></i>
      </button>
    </div>

    <div class="text-[11px] text-slate-500 hidden sm:block">
      Dica: Você pode virar a folha arrastando a borda com o mouse ou usando as setas do teclado.
    </div>
  </footer>

  <!-- ================= MODAL DE ÍNDICE / MINIATURAS ================= -->
  <div id="modal-thumbnails" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md p-6 sm:p-12 flex flex-col justify-between">
    <div class="flex items-center justify-between border-b border-white/10 pb-4">
      <h3 class="text-lg font-display font-semibold text-white flex items-center gap-2">
        <i data-lucide="layout-grid" class="w-5 h-5 text-primary"></i> Índice Completo (10 Páginas)
      </h3>
      <button onclick="toggleThumbnails()" class="p-2 rounded-lg bg-white/10 text-white hover:bg-white/20">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div id="thumbnails-grid" class="grid grid-cols-2 sm:grid-cols-5 gap-4 my-6 overflow-y-auto max-h-[70vh] p-2">
      <!-- Inserido dinamicamente -->
    </div>

    <div class="text-center">
      <button onclick="toggleThumbnails()" class="px-6 py-2 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs">
        Fechar Índice
      </button>
    </div>
  </div>

  <!-- BIBLIOTECA PAGE-FLIP EMBUTIDA DIRETAMENTE (OFFLINE & STANDALONE) -->
  <script>

    // INICIALIZAÇÃO ROBUSTA DO FLIPBOOK
    let pageFlip = null;

    function initFlipbook() {
      try {
        renderPages();
        buildThumbnails();

        const el = document.getElementById('magazine');
        if (!el) return;

        const winW = window.innerWidth;
        const winH = window.innerHeight;
        
        let pageW = Math.min(520, Math.floor(winW * 0.44));
        let pageH = Math.min(740, Math.floor(winH * 0.80));

        if (winW < 768) {
          pageW = Math.min(420, Math.floor(winW * 0.92));
          pageH = Math.min(640, Math.floor(winH * 0.78));
        }

        if (typeof St !== 'undefined' && St.PageFlip) {
          pageFlip = new St.PageFlip(el, {
            width: pageW,
            height: pageH,
            size: "fixed",
            minWidth: 320,
            maxWidth: 620,
            minHeight: 460,
            maxHeight: 880,
            maxShadowOpacity: 0.5,
            showCover: true,
            useMouseEvents: true,
            usePortrait: winW < 768,
            startPage: 0,
            drawShadow: true,
            flippingTime: 650
          });

          pageFlip.loadFromHTML(document.querySelectorAll('.page'));

          pageFlip.on('flip', (e) => {
            updateCounter(e.data);
          });
        }

        updateCounter(0);
        if (typeof lucide !== 'undefined') {
          lucide.createIcons();
        }
      } catch (err) {
        console.error("Flipbook initialization error:", err);
      }
    }

    function updateCounter(pageIndex) {
      const counter = document.getElementById('page-counter');
      if (!counter) return;
      const total = 10;
      if (pageIndex === 0) {
        counter.textContent = `Capa · Pág 1 de ${total}`;
      } else if (pageIndex >= total - 1) {
        counter.textContent = `Contracapa · Pág ${total} de ${total}`;
      } else {
        const left = pageIndex + 1;
        const right = Math.min(pageIndex + 2, total);
        counter.textContent = `Páginas ${left}-${right} de ${total}`;
      }
    }

    function flipPrev() { if (pageFlip) pageFlip.flipPrev(); }
    function flipNext() { if (pageFlip) pageFlip.flipNext(); }

    function goToPage(index) {
      if (pageFlip) {
        pageFlip.flip(index);
        const modal = document.getElementById('modal-thumbnails');
        if (modal) modal.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    function toggleThumbnails() {
      const modal = document.getElementById('modal-thumbnails');
      if (modal) modal.classList.toggle('hidden');
    }

    function buildThumbnails() {
      const grid = document.getElementById('thumbnails-grid');
      if (!grid) return;

      const titles = [
        "Capa Oficial",
        "Manifesto Institucional",
        "Índice do Catálogo",
        "Ficha: Dashboard",
        "Ficha: Financeiro",
        "Ficha: Agenda",
        "Ficha: Clientes",
        "Ficha: Equipe & Metas",
        "Ficha: Serviços & Preços",
        "Contracapa & Contato"
      ];

      grid.innerHTML = titles.map((t, idx) => `
        <button onclick="goToPage(${idx})" class="p-3 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 text-left transition-all hover:scale-105">
          <span class="text-[10px] text-primary font-bold block mb-1">PÁG ${idx + 1}</span>
          <strong class="text-xs text-white block truncate">${t}</strong>
          <span class="text-[10px] text-slate-400">Clique para abrir</span>
        </button>
      `).join('');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') flipNext();
      if (e.key === 'ArrowLeft') flipPrev();
      if (e.key === 'Escape') {
        const modal = document.getElementById('modal-thumbnails');
        if (modal) modal.classList.add('hidden');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(initFlipbook, 100);
    });

    window.addEventListener('resize', () => {
      if (pageFlip) {
        try {
          pageFlip.destroy();
          setTimeout(initFlipbook, 150);
        } catch(e) {}
      }
    });
